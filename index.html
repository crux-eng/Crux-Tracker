<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crux — DRGL</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crux">
<meta name="theme-color" content="#9A6A17">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<script src="config.js"></script>
<style>
  html,body{margin:0;height:100%}
  #crux-boot{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;padding:24px;
    background:linear-gradient(145deg,#17130E 0%,#9A6A17 100%);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;transition:opacity .25s}
  #crux-boot .card{text-align:center;color:#fff;max-width:340px;width:100%}
  #crux-boot img{width:76px;height:76px;border-radius:18px;box-shadow:0 10px 30px rgba(0,0,0,.35)}
  #crux-boot h1{font-size:30px;margin:16px 0 2px;letter-spacing:.5px}
  #crux-boot .sub{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;opacity:.7}
  #crux-boot .bar{height:4px;background:rgba(255,255,255,.15);border-radius:3px;margin:28px auto 0;width:160px;overflow:hidden}
  #crux-boot .bar i{display:block;height:100%;width:40%;background:#E8A33D;border-radius:3px;animation:cruxbar 1.1s ease-in-out infinite}
  #crux-boot .msg{font-size:13.5px;opacity:.85;margin-top:16px;min-height:20px;line-height:1.5}
  #crux-boot .why{font-size:11.5px;margin-top:14px;padding:10px 12px;border-radius:10px;background:rgba(255,255,255,.1);text-align:left;line-height:1.5;display:none;word-break:break-word}
  #crux-boot button{margin-top:18px;background:#fff;color:#9A6A17;border:none;border-radius:10px;padding:11px 22px;font-size:14px;font-weight:600;cursor:pointer;display:none}
  @keyframes cruxbar{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
</style>
</head>
<body>
<div id="crux-boot"><div class="card">
  <img src="icon.svg" alt="">
  <h1>Crux</h1>
  <div class="sub">Property Management · DRGL</div>
  <div class="bar" id="crux-bar"><i></i></div>
  <div class="msg" id="crux-msg">Loading…</div>
  <div class="why" id="crux-why"></div>
  <button id="crux-retry" onclick="location.reload()">Try again</button>
</div></div>

<script>
/* ──────────────────────────────────────────────────────────────
   CRUX LOADER (GitHub Pages)
   This page holds no app code. On every visit it fetches the latest
   Crux screens from the Apps Script backend (TRACKER.html) and runs
   them — so changes made in Apps Script appear here automatically
   after "Deploy → New version". A copy is kept on the device so a
   slow or failed connection still opens the last version.
   ────────────────────────────────────────────────────────────── */
(function () {
  // A guest room QR link that opened the staff app by mistake: go straight to the guest feedback page.
  try { var q = new URLSearchParams(location.search); if (q.get('p') && q.get('r') && q.get('k')) { location.replace('feedback.html' + location.search); return; } } catch (e) {}
  var BUILT_IN = 'https://script.google.com/macros/s/AKfycby9i0g6Nko-31a3FjtToKIvSUPM_dRQMSUq6H97SmQK1idizt2DFDSALd_wPwzRQ06I2Q/exec';
  var CACHE_KEY = 'crux_app_html_v1', SLOW_MS = 12000, GIVE_UP_MS = 45000;

  function clean(v) {
    var u = String(v || '').trim().replace(/[?#].*$/, '').replace(/\/+$/, '').replace(/\/(dev|edit|usercallback)$/, '/exec');
    return /^https:\/\/script\.google\.com\/(a\/macros\/[^/]+|macros)\/s\/[\w-]+\/exec$/.test(u) ? u : '';
  }
  var API = clean(window.CRUX_API_URL) || clean(BUILT_IN);
  var msg = function (t) { document.getElementById('crux-msg').textContent = t; };
  var started = false;

  function readCache() { try { return localStorage.getItem(CACHE_KEY); } catch (e) { return null; } }
  function writeCache(h) { try { localStorage.setItem(CACHE_KEY, h); } catch (e) {} }

  // Shows a plain reason + the exact fix, so the admin knows what to change.
  function fail(reason) {
    document.getElementById('crux-bar').style.display = 'none';
    msg("Crux couldn't open just now.");
    var fix = 'Check your internet connection and tap Try again.';
    var r = String(reason || '');
    if (/Unauthorised|Unknown action/i.test(r)) fix = 'For the admin: the live Apps Script is an older version. In Apps Script go to Deploy → Manage deployments → ✏️ (edit the EXISTING deployment) → Version: New version → Deploy.';
    else if (/not-json/i.test(r)) fix = 'For the admin: Google asked for sign-in instead of returning data. In Deploy → Manage deployments → ✏️ set "Who has access" to "Anyone" and deploy a new version.';
    else if (/TRACKER|HtmlService|No HTML file/i.test(r)) fix = 'For the admin: Apps Script could not find the TRACKER.html file — make sure the HTML file is named exactly TRACKER.';
    else if (/no-link/i.test(r)) fix = 'For the admin: no Apps Script link is set in config.js.';
    else if (/abort|timeout/i.test(r)) fix = 'Google took too long to answer. Tap Try again in a moment.';
    var why = document.getElementById('crux-why');
    why.textContent = fix + (r ? '  [' + r.slice(0, 160) + ']' : '');
    why.style.display = 'block';
    document.getElementById('crux-retry').style.display = 'inline-block';
  }

  // Load external scripts one after another, run inline ones in order — exactly as the browser would.
  function runScripts(list, i, done) {
    if (i >= list.length) return done();
    var old = list[i], s = document.createElement('script');
    for (var a = 0; a < old.attributes.length; a++) s.setAttribute(old.attributes[a].name, old.attributes[a].value);
    if (old.src) {
      s.async = false;
      s.onload = s.onerror = function () { runScripts(list, i + 1, done); };
      document.body.appendChild(s);
    } else {
      // Check each section first, so one broken section is named and skipped instead of stopping the app.
      try { new Function(old.text); }
      catch (e) {
        console.error('Crux: section ' + (i + 1) + ' of ' + list.length + ' has a syntax error (' + e.message + '). It starts: ' + old.text.trim().slice(0, 160));
        // Find the exact broken line so it can be fixed quickly.
        try {
          var src = old.text, url = URL.createObjectURL(new Blob([src], { type: 'text/javascript' }));
          var onErr = function (ev) {
            if (ev.filename !== url) return;
            window.removeEventListener('error', onErr, true); ev.preventDefault();
            var lines = src.split('\n'), n = ev.lineno || 0, col = ev.colno || 0, L = lines[n - 1] || '';
            console.error('Crux: broken line ' + n + ', column ' + col + ':\n' + L.slice(Math.max(0, col - 160), col + 160) +
              '\n\nLine before: ' + (lines[n - 2] || '').slice(0, 300) + '\nCharacter codes near the error: ' +
              Array.prototype.map.call(L.slice(Math.max(0, col - 12), col + 12), function (c) { return c.charCodeAt(0); }).join(' '));
          };
          window.addEventListener('error', onErr, true);
          var bs = document.createElement('script'); bs.src = url; document.head.appendChild(bs);
        } catch (x) {}
        try { localStorage.removeItem(CACHE_KEY); } catch (x) {}
        runScripts(list, i + 1, done); return;
      }
      s.text = old.text;
      document.body.appendChild(s);
      runScripts(list, i + 1, done);
    }
  }

  function start(html) {
    if (started) return; started = true;
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var scripts = Array.prototype.slice.call(doc.querySelectorAll('script'));
    scripts.forEach(function (s) { s.parentNode.removeChild(s); });
    // Head: styles, fonts, meta (keep our own manifest/icons).
    Array.prototype.forEach.call(doc.head.children, function (el) {
      var tag = el.tagName.toLowerCase();
      if (tag === 'title') { document.title = el.textContent || document.title; return; }
      if (tag === 'meta' && (el.getAttribute('charset') || el.getAttribute('name') === 'viewport')) return;
      document.head.appendChild(document.importNode(el, true));
    });
    // Body: the app's markup (the splash stays on top until the app has started).
    var boot = document.getElementById('crux-boot');
    Array.prototype.forEach.call(doc.body.attributes, function (a) { document.body.setAttribute(a.name, a.value); });
    var frag = document.createDocumentFragment();
    Array.prototype.forEach.call(doc.body.childNodes, function (n) { frag.appendChild(document.importNode(n, true)); });
    document.body.insertBefore(frag, boot);
    runScripts(scripts, 0, function () {
      // The app waits for DOMContentLoaded / load — fire them now that its code is in place.
      document.dispatchEvent(new Event('DOMContentLoaded', { bubbles: true }));
      window.dispatchEvent(new Event('load'));
      boot.style.opacity = '0';
      setTimeout(function () { if (boot.parentNode) boot.parentNode.removeChild(boot); }, 300);
    });
  }

  if (!API) { fail('no-link'); return; }
  var cached = readCache();
  var slow = setTimeout(function () { if (cached) { msg('Opening saved version…'); start(cached); } else msg('Still loading — the server is waking up…'); }, SLOW_MS);

  var ctrl = window.AbortController ? new AbortController() : null;
  var giveUp = setTimeout(function () { if (ctrl) ctrl.abort(); }, GIVE_UP_MS);
  fetch(API + '?data=' + encodeURIComponent(JSON.stringify({ action: 'getAppHtml' })) + '&t=' + Date.now(), ctrl ? { signal: ctrl.signal } : {})
    .then(function (r) { return r.text(); })
    .then(function (t) { try { return JSON.parse(t); } catch (e) { throw new Error('not-json: ' + t.slice(0, 80).replace(/\s+/g, ' ')); } })
    .then(function (d) {
      clearTimeout(slow); clearTimeout(giveUp);
      if (!d || !d.ok || !d.html) throw new Error((d && d.error) || 'No app');
      writeCache(d.html);
      if (started && cached && d.html !== cached) {
        // A saved older copy was opened because the network was slow; offer the new version.
        var bar = document.createElement('div');
        bar.textContent = 'Crux has been updated — tap here to load the new version';
        bar.style.cssText = 'position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:99999;background:#9A6A17;color:#fff;padding:12px 18px;border-radius:12px;font:600 14px Arial,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.3);cursor:pointer';
        bar.onclick = function () { location.reload(); };
        document.body.appendChild(bar);
        return;
      }
      start(d.html);
    })
    .catch(function (err) {
      clearTimeout(slow); clearTimeout(giveUp);
      var why = err && (err.name === 'AbortError' ? 'timeout' : err.message);
      console.error('Crux: could not load the latest app from the server (' + why + '). Server: ' + API);
      if (cached) {
        start(cached);
        // Say so, instead of silently showing an older saved copy.
        var bar = document.createElement('div');
        bar.textContent = 'Showing a saved copy — could not reach the Crux server (' + String(why).slice(0, 90) + '). Tap to try again.';
        bar.style.cssText = 'position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:99999;background:#B45309;color:#fff;padding:12px 18px;border-radius:12px;font:600 13px Arial,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.3);cursor:pointer;max-width:92vw;text-align:center';
        bar.onclick = function () { location.reload(); };
        document.body.appendChild(bar);
      } else if (!started) fail(why);
    });
})();
</script>
</body>
</html>
